services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Persist the vector DB and SQLite chat history across container restarts
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
