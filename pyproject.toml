[project]
name = "tech-fault-rag-bot"
version = "0.1.0"
description = "A RAG chatbot for technical troubleshooting using FastAPI, ChromaDB, and OpenAI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.5",
    "fastapi>=0.135.1",
    "openai>=2.29.0",
    "pypdf>=6.9.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = [
    "tech-fault-rag-bot",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
